# Render Infrastructure Blueprint — Havells Sambandh
services:
  - type: web
    name: havells-sambandh-api
    runtime: python
    rootDir: backend
    buildCommand: ../scripts/build_backend.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: havells-sambandh-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: havells-sambandh-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: havells-sambandh-redis
          property: connectionString

  - type: worker
    name: havells-sambandh-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements/production.txt
    startCommand: celery -A config worker --beat -l info --concurrency 2
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: havells-sambandh-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: havells-sambandh-redis
          property: connectionString

  - type: web
    name: havells-sambandh-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: havells-sambandh-redis
    plan: starter
    ipAllowList: []

databases:
  - name: havells-sambandh-db
    databaseName: havells_sambandh
    plan: starter
